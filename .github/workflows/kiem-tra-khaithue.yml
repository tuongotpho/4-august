# Khai thuế: mỗi lần đẩy code — chạy test + build, và kiểm luật phân quyền Firebase trên máy giả lập (chép từ repo cũ khaithue).
# Đỏ là có lỗi — Vercel (project khaithue, Root Directory apps/khaithue/app) cũng chạy test trước khi build nên không đưa bản lỗi lên.
name: Kiểm tra khaithue

on:
  push:
    branches: [main]
    paths: ['apps/khaithue/**', '.github/workflows/kiem-tra-khaithue.yml']
  pull_request:
    paths: ['apps/khaithue/**', '.github/workflows/kiem-tra-khaithue.yml']
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/khaithue/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/khaithue/app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  luat-phan-quyen:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/khaithue/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/khaithue/app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm i -g firebase-tools
      - run: npm run test:quyen
