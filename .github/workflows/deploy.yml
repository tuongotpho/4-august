# Kiểm tra mỗi lần đẩy code: kiểu + test + đóng gói thử.
# Deploy do Vercel tự làm (nối Git) — Vercel cũng chạy test trước khi build (vercel.json): test đỏ thì KHÔNG lên mạng,
# giống rơ-le chặn đóng điện khi đo cách điện không đạt.
name: Kiểm tra

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build && npm run build:vercel
